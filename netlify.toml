# Plain Digital — Netlify config

[build]
  # Sitio 100% estático: no hay comando de build, publicamos la raíz.
  publish = "."

# Encabezados de seguridad y caché
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirección directa al thank-you (por si alguien llega vía POST directo)
[[redirects]]
  from = "/contacto"
  to = "/#contacto"
  status = 301
